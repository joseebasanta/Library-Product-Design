<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Library — Jose's curated design resources</title>
<meta name="description" content="A curated library of UI/UX, product design and web design resources." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f4f4f4;
  --bg-elev: #ffffff;
  --ink: #333333;
  --ink-soft: #5c5c5c;
  --ink-faint: #8f8f8f;
  --line: #e2e2e2;
  --accent: #1f1f1f;
  --accent-soft: #1f1f1f1a;
  --title-color: #000000;
  --asilo: #1a5cff;
  --asilo-soft: rgba(26, 92, 255, 0.06);

  /* ---- Font families (Inter; display = display optical size) ---- */
  --font-display: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --font-text: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  /* aliases kept for existing rules */
  --serif: var(--font-display);
  --sans: var(--font-text);
  --mono: var(--font-text);

  /* ---- Type scale (Figma "Play Ground" template) ---- */
  /* Titles — display, weight 500 */
  --title-h1: 56px; --title-h1-lh: 64px; --title-h1-ls: -0.01em;
  --title-h2: 48px; --title-h2-lh: 56px; --title-h2-ls: -0.01em;
  --title-h3: 40px; --title-h3-lh: 48px; --title-h3-ls: -0.01em;
  --title-h4: 32px; --title-h4-lh: 40px; --title-h4-ls: -0.005em;
  --title-h5: 24px; --title-h5-lh: 32px; --title-h5-ls: 0em;
  --title-h6: 20px; --title-h6-lh: 28px; --title-h6-ls: 0em;

  /* Subheading — uppercase, weight 500 */
  --sub-md:  16px; --sub-md-lh:  24px; --sub-md-ls:  0.08em;
  --sub-sm:  14px; --sub-sm-lh:  20px; --sub-sm-ls:  0.06em;
  --sub-xs:  12px; --sub-xs-lh:  16px; --sub-xs-ls:  0.04em;
  --sub-2xs: 11px; --sub-2xs-lh: 12px; --sub-2xs-ls: 0.02em;

  /* Labels — weight 500 */
  --label-xl: 24px; --label-xl-lh: 32px; --label-xl-ls: -0.015em;
  --label-lg: 18px; --label-lg-lh: 24px; --label-lg-ls: -0.015em;
  --label-md: 16px; --label-md-lh: 24px; --label-md-ls: -0.011em;
  --label-sm: 14px; --label-sm-lh: 20px; --label-sm-ls: -0.006em;
  --label-xs: 12px; --label-xs-lh: 16px; --label-xs-ls: 0em;

  /* Paragraphs — weight 400 */
  --para-xl: 24px; --para-xl-lh: 32px; --para-xl-ls: -0.015em;
  --para-lg: 18px; --para-lg-lh: 24px; --para-lg-ls: -0.015em;
  --para-md: 16px; --para-md-lh: 24px; --para-md-ls: -0.011em;
  --para-sm: 14px; --para-sm-lh: 20px; --para-sm-ls: -0.008em;
  --para-xs: 12px; --para-xs-lh: 16px; --para-xs-ls: 0em;

  /* Weights */
  --w-title: 500; --w-label: 500; --w-sub: 500; --w-para: 400;
}

[data-theme="dark"] {
  --bg: #101010;
  --bg-elev: #1a1a1a;
  --ink: #d9d9d9;
  --ink-soft: #a0a0a0;
  --ink-faint: #707070;
  --line: #2c2c2c;
  --accent: #ededed;
  --accent-soft: #ededed1a;
  --title-color: #ffffff;
  --asilo-soft: rgba(56, 120, 255, 0.16);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-text);
  font-weight: var(--w-para);
  font-optical-sizing: auto;
  font-size: var(--para-sm);
  line-height: var(--para-sm-lh);
  letter-spacing: var(--para-sm-ls);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }

/* ---------- Layout ---------- */

.page {
  display: grid;
  grid-template-columns: 280px 1fr;
  max-width: 1400px;
  margin: 0 auto;
  min-height: 100vh;
}

@media (max-width: 860px) {
  .page { grid-template-columns: 1fr; }
}

/* ---------- Sidebar ---------- */

.sidebar {
  border-right: 1px solid var(--line);
  padding: 48px 32px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

@media (max-width: 860px) {
  .sidebar {
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--line);
    padding: 32px 24px;
  }
}

.brand-mark {
  display: block;
  margin-bottom: 16px;
}

.brand-mark img {
  height: 38px;
  width: auto;
  display: block;
}

.brand-mark .brand-mark-dark { display: none; }
[data-theme="dark"] .brand-mark .brand-mark-light { display: none; }
[data-theme="dark"] .brand-mark .brand-mark-dark { display: block; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .brand-mark .brand-mark-light { display: none; }
  :root:not([data-theme="light"]) .brand-mark .brand-mark-dark { display: block; }
}

.brand {
  font-family: var(--font-serif);
  font-weight: var(--w-title);
  font-size: var(--title-h4);
  line-height: var(--title-h4-lh);
  letter-spacing: var(--title-h4-ls);
  color: var(--title-color);
  margin-bottom: 40px;
}

.search-wrap {
  position: relative;
  margin-bottom: 32px;
}

.search {
  width: 100%;
  font-family: var(--font-text);
  font-size: var(--para-sm);
  line-height: var(--para-sm-lh);
  letter-spacing: var(--para-sm-ls);
  padding: 10px 12px 10px 32px;
  border: 1px solid var(--line);
  background: var(--bg-elev);
  color: var(--ink);
  border-radius: 6px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}

.search:focus {
  border-color: var(--asilo);
  box-shadow: 0 0 0 3px var(--asilo-soft);
}

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-faint);
  pointer-events: none;
}

.nav-label {
  font-family: var(--font-text);
  font-weight: var(--w-sub);
  font-size: var(--sub-2xs);
  line-height: var(--sub-2xs-lh);
  letter-spacing: var(--sub-2xs-ls);
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 12px;
}

.nav { list-style: none; }

.nav li {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 6px 0;
  font-size: var(--para-sm);
  line-height: var(--para-sm-lh);
  letter-spacing: var(--para-sm-ls);
  color: var(--ink-soft);
  cursor: pointer;
  transition: color .15s;
  border-bottom: 1px dashed transparent;
}

.nav li:hover { color: var(--asilo); }

.nav li.active {
  color: var(--accent);
  font-weight: var(--w-label);
}

.nav .count {
  font-family: var(--font-text);
  font-size: var(--para-xs);
  line-height: var(--para-xs-lh);
  color: var(--ink-faint);
  font-weight: var(--w-label);
  font-variant-numeric: tabular-nums;
}

.theme-toggle {
  margin-top: 40px;
  font-family: var(--font-text);
  font-weight: var(--w-sub);
  font-size: var(--sub-2xs);
  line-height: var(--sub-2xs-lh);
  letter-spacing: var(--sub-2xs-ls);
  text-transform: uppercase;
  color: var(--ink-faint);
  background: none;
  border: 1px solid var(--line);
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  transition: all .15s;
}

.theme-toggle:hover {
  color: var(--ink);
  border-color: var(--ink-faint);
}

/* ---------- Main ---------- */

.main {
  padding: 80px 64px 120px;
  max-width: 920px;
}

@media (max-width: 860px) {
  .main { padding: 48px 24px 80px; }
}

.intro {
  margin-bottom: 56px;
  padding-bottom: 32px;
  border-bottom: 1px solid var(--line);
}

.intro h1 {
  font-family: var(--font-serif);
  font-weight: var(--w-title);
  font-size: var(--title-h4);
  line-height: var(--title-h4-lh);
  letter-spacing: var(--title-h4-ls);
  color: var(--title-color);
  margin-bottom: 14px;
}

.intro h1 em {
  font-style: normal;
  color: inherit;
}

.intro p {
  font-family: var(--font-text);
  font-weight: var(--w-para);
  font-size: var(--para-md);
  line-height: var(--para-md-lh);
  letter-spacing: var(--para-md-ls);
  color: var(--ink-soft);
  max-width: 540px;
}

.intro .meta {
  margin-top: 24px;
  font-family: var(--font-text);
  font-weight: var(--w-sub);
  font-size: var(--sub-xs);
  line-height: var(--sub-xs-lh);
  letter-spacing: var(--sub-xs-ls);
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* ---------- Category section ---------- */

.category {
  margin-bottom: 96px;
  scroll-margin-top: 32px;
}

.category-header {
  display: grid;
  grid-template-columns: minmax(220px, 300px) 1fr;
  gap: 40px;
  align-items: start;
  margin-bottom: 44px;
}

@media (max-width: 860px) {
  .category-header {
    grid-template-columns: 1fr;
    gap: 16px;
  }
}

.category-heading {
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.category-title {
  font-family: var(--font-serif);
  font-weight: var(--w-title);
  font-size: var(--title-h5);
  line-height: var(--title-h5-lh);
  letter-spacing: var(--title-h5-ls);
  color: var(--title-color);
}

.category-desc {
  font-family: var(--font-serif);
  font-weight: var(--w-para);
  font-size: var(--para-xl);
  line-height: var(--para-xl-lh);
  letter-spacing: var(--para-xl-ls);
  color: var(--ink-soft);
  padding-top: 2px;
}

/* ---------- Resource items ---------- */

.resources {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px 32px;
}

@media (max-width: 1100px) {
  .resources { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 640px) {
  .resources { grid-template-columns: 1fr; }
}

.resource {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  padding: 14px;
  margin: -14px;
  border-radius: 10px;
  transition: background .18s ease, transform .18s ease;
}

.resource:hover {
  background: var(--asilo-soft);
  transform: translateY(-2px);
}

.resource-head {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.resource-favicon {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  flex-shrink: 0;
  object-fit: contain;
}

.resource-name {
  font-family: var(--font-text);
  font-weight: var(--w-label);
  font-size: var(--label-md);
  line-height: var(--label-md-lh);
  letter-spacing: var(--label-md-ls);
  color: var(--title-color);
  transition: color .15s;
  min-width: 0;
}

.resource:hover .resource-name {
  color: var(--asilo);
}

.resource-desc {
  font-family: var(--font-text);
  font-weight: var(--w-para);
  font-size: var(--para-sm);
  line-height: var(--para-sm-lh);
  letter-spacing: var(--para-sm-ls);
  color: var(--ink-soft);
}

.resource-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 2px;
  flex-wrap: wrap;
}

.resource-host {
  font-family: var(--font-text);
  font-weight: var(--w-para);
  font-size: var(--para-xs);
  line-height: var(--para-xs-lh);
  letter-spacing: var(--para-xs-ls);
  color: var(--ink-faint);
}

/* ---------- Empty state ---------- */

.empty {
  padding: 24px 0;
  font-family: var(--font-text);
  font-size: var(--para-md);
  line-height: var(--para-md-lh);
  letter-spacing: var(--para-md-ls);
  color: var(--ink-faint);
  border-bottom: 1px dashed var(--line);
}

.empty::before {
  content: "—  ";
  font-style: normal;
  color: var(--ink-faint);
}

/* ---------- Footer ---------- */

.footer {
  margin-top: 80px;
  padding-top: 32px;
  border-top: 1px solid var(--line);
  font-family: var(--font-text);
  font-weight: var(--w-sub);
  font-size: var(--sub-2xs);
  line-height: var(--sub-2xs-lh);
  text-transform: uppercase;
  letter-spacing: var(--sub-2xs-ls);
  color: var(--ink-faint);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.footer-credit {
  display: flex;
  align-items: center;
  gap: 4px;
  text-transform: none;
  font-size: var(--para-sm);
  line-height: var(--para-sm-lh);
  letter-spacing: var(--para-sm-ls);
  font-weight: var(--w-para);
  color: var(--ink-soft);
}

.footer-heart {
  color: var(--asilo);
  font-size: 12px;
}

.footer-asilo {
  display: inline-flex;
  align-items: center;
}

.footer-asilo img {
  height: 18px;
  width: auto;
  display: block;
}

/* Show the right logo per theme */
.footer-asilo .asilo-dark { display: none; }
[data-theme="dark"] .footer-asilo .asilo-light { display: none; }
[data-theme="dark"] .footer-asilo .asilo-dark { display: block; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .footer-asilo .asilo-light { display: none; }
  :root:not([data-theme="light"]) .footer-asilo .asilo-dark { display: block; }
}

/* ---------- Footer curator ---------- */

.footer-curator {
  display: flex;
  align-items: center;
  gap: 4px;
  text-transform: none;
  font-size: var(--para-sm);
  line-height: var(--para-sm-lh);
  letter-spacing: var(--para-sm-ls);
  font-weight: var(--w-para);
  color: var(--ink-soft);
}

.footer-copy {
  font-family: var(--font-text);
  font-weight: var(--w-sub);
  font-size: var(--sub-2xs);
  line-height: var(--sub-2xs-lh);
  text-transform: uppercase;
  letter-spacing: var(--sub-2xs-ls);
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.footer-curated-by { color: var(--ink-soft); }

.footer-avatar {
  position: relative;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
}

.curator-photo,
.curator-linkicon {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .18s ease;
}

.curator-photo img,
.curator-photo .curator-icon {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.curator-linkicon {
  opacity: 0;
  background: var(--ink);
  color: var(--bg);
}

.footer-curator-name {
  color: var(--ink);
  font-weight: var(--w-label);
  font-size: var(--label-sm);
  line-height: var(--label-sm-lh);
  letter-spacing: var(--label-sm-ls);
  text-decoration: underline;
  text-decoration-color: var(--line);
  text-underline-offset: 3px;
  transition: text-decoration-color .15s, color .15s;
}

.footer-curator:hover .curator-photo { opacity: 0; }
.footer-curator:hover .curator-linkicon { opacity: 1; }
.footer-curator:hover .footer-curator-name { text-decoration-color: var(--ink-faint); }

.footer-updated { white-space: nowrap; }

/* ---------- Scrollbar polish ---------- */

.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

/* ---------- Search no-match ---------- */

.no-results {
  font-family: var(--font-display);
  font-weight: var(--w-title);
  font-size: var(--title-h5);
  line-height: var(--title-h5-lh);
  letter-spacing: var(--title-h5-ls);
  color: var(--ink-faint);
  text-align: center;
  padding: 80px 0;
}

/* ---------- Back to top ---------- */

.back-top {
  position: fixed;
  bottom: 32px;
  right: 32px;
  width: 40px;
  height: 40px;
  background: var(--ink);
  color: var(--bg);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .2s, transform .2s, background .15s;
  pointer-events: none;
  z-index: 100;
}

.back-top.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.back-top:hover {
  background: var(--accent);
}

@media (max-width: 860px) {
  .back-top { bottom: 24px; right: 24px; }
}

/* ---------- Fade-in on load ---------- */

.category {
  animation: fadeIn .6s ease both;
}
.category:nth-child(1) { animation-delay: .05s; }
.category:nth-child(2) { animation-delay: .1s; }
.category:nth-child(3) { animation-delay: .15s; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="page">

  <!-- ============ SIDEBAR ============ -->

/* ============================================================
   RENDER
   ============================================================ */

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function getHost(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch { return ''; }
}

function renderNav() {
  const nav = $('#nav');
  nav.innerHTML = DATA.map(cat => `
    <li data-target="${cat.id}">
      <span>${cat.title}</span>
      <span class="count">${String(cat.resources.length).padStart(2, '0')}</span>
    </li>
  `).join('');

  $$('#nav li').forEach(li => {
    li.addEventListener('click', () => {
      const target = li.dataset.target;
      const el = document.getElementById(target);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

function renderCategories() {
  const container = $('#categoriesContainer');
  container.innerHTML = DATA.map(cat => `
    <section class="category" id="${cat.id}">
      <div class="category-header">
        <div class="category-heading">
          <h2 class="category-title">${cat.title}</h2>
        </div>
        ${cat.desc ? `<p class="category-desc">${cat.desc}</p>` : '<span></span>'}
      </div>
      <div class="resources">
        ${cat.resources.length === 0
          ? `<div class="empty">No resources in this category yet.</div>`
          : cat.resources.map(r => `
            <a class="resource" href="${r.url}" target="_blank" rel="noopener">
              <div class="resource-head">
                <img class="resource-favicon" src="https://www.google.com/s2/favicons?sz=64&domain=${getHost(r.url)}" alt="" loading="lazy" width="16" height="16" onerror="this.style.display='none'" />
                <div class="resource-name">${r.name}</div>
              </div>
              ${r.desc ? `<div class="resource-desc">${r.desc}</div>` : ''}
              <div class="resource-meta">
                <span class="resource-host">↗ ${getHost(r.url)}</span>
              </div>
            </a>
          `).join('')}
      </div>
    </section>
  `).join('');
}

function updateMeta() {
  const total = DATA.reduce((sum, cat) => sum + cat.resources.length, 0);
  $('#totalMeta').textContent = `${String(total).padStart(3, '0')} resources · ${DATA.length} categories`;
  const yearEl = document.getElementById('footerYear');
  if (yearEl) yearEl.textContent = new Date().getFullYear();
}

/* ---------- Search ---------- */

function setupSearch() {
  const search = $('#search');
  search.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    const categories = $$('.category');
    let anyVisible = false;

    categories.forEach(catEl => {
      const resources = catEl.querySelectorAll('.resource');
      const empties = catEl.querySelectorAll('.empty');
      let catHasMatch = false;

      if (q === '') {
        // reset
        catEl.style.display = '';
        resources.forEach(r => r.style.display = '');
        empties.forEach(e => e.style.display = '');
        anyVisible = true;
        return;
      }

      // hide "empty" placeholders during search
      empties.forEach(e => e.style.display = 'none');

      resources.forEach(r => {
        const text = r.textContent.toLowerCase();
        if (text.includes(q)) {
          r.style.display = '';
          catHasMatch = true;
        } else {
          r.style.display = 'none';
        }
      });

      const titleMatch = catEl.querySelector('.category-title').textContent.toLowerCase().includes(q);
      if (catHasMatch || titleMatch) {
        catEl.style.display = '';
        anyVisible = true;
      } else {
        catEl.style.display = 'none';
      }
    });

    // no-results message
    let noRes = $('#noResults');
    if (!anyVisible && q !== '') {
      if (!noRes) {
        noRes = document.createElement('div');
        noRes.id = 'noResults';
        noRes.className = 'no-results';
        noRes.textContent = 'Nothing found.';
        $('#categoriesContainer').appendChild(noRes);
      }
      noRes.style.display = '';
    } else if (noRes) {
      noRes.style.display = 'none';
    }
  });
}

/* ---------- Theme ---------- */

function setupTheme() {
  const saved = localStorage.getItem('lib-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);

  $('#themeToggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('lib-theme', next);
  });
}

/* ---------- Back to top ---------- */

function setupBackTop() {
  const btn = $('#backTop');
  window.addEventListener('scroll', () => {
    btn.classList.toggle('visible', window.scrollY > 400);
  }, { passive: true });
  btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
}

/* ---------- Init ---------- */

renderNav();
renderCategories();
updateMeta();
setupSearch();
setupTheme();
setupBackTop();
</script>
